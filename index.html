<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <!-- viewport-fit=cover + Notch/Home-Indicator Support -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#111111">

    <!-- Damit die App im Vollbild läuft, wenn man sie über "Zum Home-Bildschirm" hinzufügt -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AR Zeichnen">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="format-detection" content="telephone=no">

    <title>Einfache AR Drawing App mit Zoom</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }

        html {
            /* Verhindert, dass iOS die Schrift beim Drehen vergrößert */
            -webkit-text-size-adjust: 100%;
        }

        body, html {
            width: 100%;
            /* Feste Höhe statt 100vh (iOS Safari Adressleisten-Bug) */
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
            font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
            background: #111;
            color: #fff;
            position: fixed;
            inset: 0;
            touch-action: none;
        }

        #ar-container {
            position: relative;
            width: 100%;
            height: 100%;
            /* dynamische Viewport-Höhe (moderne Browser), Fallback via JS-Variable unten */
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            touch-action: none;
        }

        #webcam-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            background: #000;
        }

        #overlay-image {
            position: absolute;
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            z-index: 2;
            opacity: 0.5;
            pointer-events: none;
            transform: scale(1);
            transform-origin: center center;
            transition: transform 0.05s ease-out;
        }

        #controls {
            position: absolute;
            /* Respektiert die Notch / Dynamic Island oben */
            top: calc(env(safe-area-inset-top, 0px) + 12px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            padding: 12px 20px;
            border-radius: 14px;
            display: flex;
            gap: 20px;
            align-items: center;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            max-width: calc(100% - 24px);
            flex-wrap: wrap;
            justify-content: center;
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        #controls.hidden {
            opacity: 0;
            pointer-events: none;
            transform: translateX(-50%) translateY(-10px);
        }

        /* Runder Knopf zum Ein-/Ausblenden der Steuerleiste */
        #toggle-controls {
            position: absolute;
            top: calc(env(safe-area-inset-top, 0px) + 12px);
            right: calc(env(safe-area-inset-right, 0px) + 12px);
            z-index: 11;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: none;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            font-size: 18px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            touch-action: manipulation;
        }

        #toggle-controls:active {
            background: rgba(255, 255, 255, 0.25);
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            font-size: 12px;
        }

        input[type="range"] {
            width: 130px;
            touch-action: pan-x;
        }

        input[type="file"] {
            color: #fff;
            font-size: 13px;
            max-width: 140px;
        }

        #placeholder-text {
            position: absolute;
            z-index: 3;
            text-align: center;
            background: rgba(0,0,0,0.8);
            padding: 20px;
            border-radius: 8px;
            pointer-events: none;
            max-width: 80%;
        }

        /* Home-Indicator unten nicht verdecken lassen */
        #bottom-safe-spacer {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: env(safe-area-inset-bottom, 0px);
            z-index: 4;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="ar-container">
        <!-- Wichtig für iOS: playsinline und muted hinzugefügt -->
        <video id="webcam-video" autoplay playsinline muted></video>

        <div id="placeholder-text">Lade oben ein Bild hoch, um mit dem AR-Zeichnen zu beginnen!</div>

        <img id="overlay-image" src="" alt="" style="display: none;">

        <div id="controls">
            <div class="control-group">
                <label for="imageLoader">Bild hochladen:</label>
                <input type="file" id="imageLoader" accept="image/*">
            </div>
            <div class="control-group">
                <label for="opacityRange">Transparenz: <span id="opacityValue">50%</span></label>
                <input type="range" id="opacityRange" min="0" max="1" step="0.05" value="0.5">
            </div>
            <div class="control-group">
                <label for="zoomRange">Zoom: <span id="zoomValue">100%</span></label>
                <input type="range" id="zoomRange" min="0.2" max="3" step="0.05" value="1">
            </div>
        </div>

        <button id="toggle-controls" title="Steuerleiste ein-/ausblenden">⚙️</button>

        <div id="bottom-safe-spacer"></div>
    </div>

    <script>
        const video = document.getElementById('webcam-video');
        const imageLoader = document.getElementById('imageLoader');
        const overlayImage = document.getElementById('overlay-image');
        const opacityRange = document.getElementById('opacityRange');
        const opacityValue = document.getElementById('opacityValue');
        const zoomRange = document.getElementById('zoomRange');
        const zoomValue = document.getElementById('zoomValue');
        const placeholderText = document.getElementById('placeholder-text');
        const arContainer = document.getElementById('ar-container');
        const controls = document.getElementById('controls');
        const toggleControlsBtn = document.getElementById('toggle-controls');

        // Steuerleiste ein-/ausblenden für die volle Ansicht
        function setControlsVisible(visible) {
            controls.classList.toggle('hidden', !visible);
            toggleControlsBtn.textContent = visible ? '⚙️' : '⚙️';
        }

        toggleControlsBtn.addEventListener('click', () => {
            const isHidden = controls.classList.contains('hidden');
            setControlsVisible(isHidden);
        });

        // 0. Fallback für echte Viewport-Höhe auf älteren iOS-Versionen
        //    (falls 100dvh nicht unterstützt wird)
        function setRealViewportHeight() {
            const vh = window.innerHeight * 0.01;
            document.documentElement.style.setProperty('--vh', `${vh}px`);
            arContainer.style.height = `${window.innerHeight}px`;
        }
        setRealViewportHeight();
        window.addEventListener('resize', setRealViewportHeight);
        window.addEventListener('orientationchange', () => {
            // kurze Verzögerung, damit iOS die neue Höhe schon gemeldet hat
            setTimeout(setRealViewportHeight, 100);
        });

        // Verhindert Pinch-Zoom / Doppeltipp-Zoom auf der Seite selbst
        document.addEventListener('gesturestart', (e) => e.preventDefault());
        document.addEventListener('dblclick', (e) => e.preventDefault());
        let lastTouchEnd = 0;
        document.addEventListener('touchend', (e) => {
            const now = Date.now();
            if (now - lastTouchEnd <= 300) e.preventDefault();
            lastTouchEnd = now;
        }, { passive: false });

        // 1. Kamera starten (mit Fallback für ältere iOS-Geräte)
        async function initCamera() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                alert("Dein Browser unterstützt den Kamerazugriff leider nicht.");
                return;
            }

            try {
                // Versuch 1: Rückkamera bevorzugen, hohe Auflösung anfragen
                const constraints = {
                    video: {
                        facingMode: { ideal: "environment" },
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    },
                    audio: false
                };
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                handleStream(stream);
            } catch (err) {
                console.warn("Rückkamera konnte nicht geladen werden, starte Standardkamera...", err);
                try {
                    // Fallback: Irgendeine verfügbare Kamera nutzen
                    const fallbackStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                    handleStream(fallbackStream);
                } catch (fallbackErr) {
                    console.error("Kamerafehler: ", fallbackErr);
                    alert("Konnte nicht auf die Kamera zugreifen. Stelle sicher, dass du Safari nutzt und die Seite über HTTPS aufrufst.");
                }
            }
        }

        function handleStream(stream) {
            video.srcObject = stream;
            video.play().catch(e => {
                console.warn("Autoplay wurde vom Browser blockiert:", e);
            });
        }

        initCamera();

        // 2. Bild-Upload verarbeiten
        imageLoader.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    overlayImage.src = event.target.result;
                    overlayImage.style.display = 'block';
                    placeholderText.style.display = 'none';

                    zoomRange.value = 1;
                    zoomValue.textContent = '100%';
                    overlayImage.style.transform = 'scale(1)';
                }
                reader.readAsDataURL(file);
            }
        });

        // 3. Transparenz-Regler steuern
        opacityRange.addEventListener('input', function() {
            const val = opacityRange.value;
            overlayImage.style.opacity = val;
            opacityValue.textContent = Math.round(val * 100) + '%';
        });

        // 4. Zoom-Regler steuern
        zoomRange.addEventListener('input', function() {
            const zoomVal = zoomRange.value;
            overlayImage.style.transform = `scale(${zoomVal})`;
            zoomValue.textContent = Math.round(zoomVal * 100) + '%';
        });
    </script>
</body>
</html>
